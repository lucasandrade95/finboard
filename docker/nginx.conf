server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Mesmo papel do proxy do Vite no dev: o SPA chama /api na própria origem.
  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    # A API roda com TRUST_PROXY=true e conta o rate limit por este IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Folga acima do limite de corpo do Fastify (1 MB): quem recusa CSV grande é a
    # API, com 413 no formato de erro dela, e não o nginx com página HTML.
    client_max_body_size 2m;
  }

  # Assets com hash no nome: cache longo é seguro.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html sem cache, senão um deploy novo ficaria preso no navegador.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
